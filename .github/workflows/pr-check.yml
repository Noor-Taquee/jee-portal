name: Pull Request Check

on:
  pull_request:
    paths-ignore:
      - .github/DISCUSSION_TEMPLATE/*
      - .github/ISSUE_TEMPLATE/*
      - .github/CODE_OF_CONDUCT.md
      - .github/CODEOWNERS
      - .github/CONTRIBUTING.md
      - .github/dependabot.yml
      - .github/FUNDING.yml
      - .github/pull_request_template.md
      - .github/SECURITY.md
      - .github/SUPPORT.md
      - .vscode/*
      - LICENSE
      - README.md

permissions:
  contents: read

jobs:
  check-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      - name: Check
        run: vp check

      - name: Build check
        run: vp build
